<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticker Drop - 表情包托管</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <span class="logo">🎨</span>
      <div>
        <h1>Sticker Drop</h1>
        <p class="subtitle">上传图片，获取可分享的链接，用于 AI 聊天表情包</p>
      </div>
    </div>
    <button class="btn-settings" id="btnSettings" title="设置">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
  </header>

  <main class="main">
    <!-- 上传区域 -->
    <section class="upload-section">
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">📁</div>
        <p class="upload-title">拖拽图片到此处上传</p>
        <p class="upload-hint">点击或拖拽即可批量上传，上传后可逐一重命名</p>
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml" multiple class="visually-hidden">
      </div>
      <div class="upload-preview hidden" id="uploadPreview">
        <div class="batch-header">
          <span class="batch-count" id="batchCount">已选 0 个文件</span>
          <div class="batch-group-row">
            <label class="preview-label">上传到分组</label>
            <select id="previewGroup" class="input-group-select"></select>
          </div>
        </div>
        <div class="batch-list" id="batchList"></div>
        <div class="preview-actions">
          <button class="btn btn-cancel" id="btnCancel">取消</button>
          <button class="btn btn-upload" id="btnUpload">上传全部图片</button>
        </div>
      </div>
    </section>

    <!-- 分组标签栏 -->
    <nav class="group-bar" id="groupTabs"></nav>

    <!-- 图库 -->
    <section class="gallery-section">
      <div class="gallery-header">
        <h2>我的表情包</h2>
        <div class="gallery-controls">
          <label class="select-all-label hidden" id="selectAllLabel">
            <input type="checkbox" id="selectAllCheckbox"> 全选
          </label>
          <button class="btn btn-batch hidden" id="btnBatchCopy">📋 复制选中</button>
          <input type="text" class="input-search" id="searchInput" placeholder="🔍 搜索文件名...">
          <button class="btn btn-refresh" id="btnRefresh">刷新</button>
        </div>
      </div>
      <div class="gallery-grid" id="galleryGrid">
        <div class="gallery-status" id="galleryLoading">
          <div class="spinner"></div>
          <p>加载中...</p>
        </div>
        <div class="gallery-status hidden" id="galleryEmpty">
          <div class="empty-icon">📭</div>
          <p>还没有表情包</p>
          <p class="empty-hint">上传第一张图片吧！</p>
        </div>
        <div class="gallery-status hidden" id="galleryNoSettings">
          <div class="empty-icon">⚙️</div>
          <p>请先点击右上角设置按钮</p>
          <p class="empty-hint">配置 GitHub Token 后即可查看图库</p>
        </div>
      </div>
    </section>
  </main>

  <!-- 设置弹窗 -->
  <dialog class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>设置</h3>
        <button class="btn-close" id="btnCloseModal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="token">GitHub Personal Access Token</label>
          <input type="password" id="token" class="input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
          <p class="form-hint">
            <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">点击这里创建 Token</a>
            → Generate new token (classic) → 勾选 <strong>repo</strong> 权限 → 复制粘贴到这里
          </p>
        </div>
        <div class="form-group">
          <label for="owner">GitHub 用户名</label>
          <input type="text" id="owner" class="input" placeholder="6zs5kxbhhy-svg">
        </div>
        <div class="form-group">
          <label for="repo">仓库名</label>
          <input type="text" id="repo" class="input" placeholder="Sticker-Drop">
        </div>
        <div class="form-group">
          <label for="branch">分支</label>
          <input type="text" id="branch" class="input" placeholder="main">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-save" id="btnSaveSettings">保存设置</button>
      </div>
    </div>
  </dialog>

  <!-- 删除确认弹窗 -->
  <dialog class="modal" id="deleteModal">
    <div class="modal-content modal-small">
      <div class="modal-header">
        <h3>确认删除</h3>
        <button class="btn-close" id="btnCloseDelete">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <p>确定要删除 <strong id="deleteFileName"></strong> 吗？此操作不可撤销。</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" id="btnCancelDelete">取消</button>
        <button class="btn btn-danger" id="btnConfirmDelete">删除</button>
      </div>
    </div>
  </dialog>

  <!-- 新建分组弹窗 -->
  <dialog class="modal modal-small" id="newGroupModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>新建分组</h3>
        <button class="btn-close" id="btnCloseNewGroup">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>分组名称</label>
          <input type="text" id="newGroupInput" class="input" placeholder="例如：搞笑、工作、日常">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" id="btnCancelNewGroup">取消</button>
        <button class="btn btn-save" id="btnCreateGroup" style="width:auto">创建</button>
      </div>
    </div>
  </dialog>

  <!-- 移动分组弹窗 -->
  <dialog class="modal modal-small" id="moveGroupModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>移动到分组</h3>
        <button class="btn-close" id="btnCloseMove">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>选择目标分组</label>
          <select id="moveGroupSelect" class="input"></select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" id="btnCancelMove">取消</button>
        <button class="btn btn-save" id="btnConfirmMove" style="width:auto">移动</button>
      </div>
    </div>
  </dialog>

  <div class="toast-container" id="toastContainer"></div>

  <footer class="footer">
    <p>图片托管于 <a href="https://github.com/6zs5kxbhhy-svg/Sticker-Drop" target="_blank" rel="noopener">GitHub</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
